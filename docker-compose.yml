version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"  
    env_file:
      - ./.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-gateway
    networks:
      - app-network

  api-gateway:
    build: 
      context: .
      dockerfile: ./api-gateway/Dockerfile
    expose:
      - "${GATEWAY_PORT}"  
    env_file:
      - ./.env
    depends_on:
      #- auth-service
      - product-service
    networks:
      - app-network
    environment:
      #- AUTH_SERVICE_URL=http://auth-service:${AUTH_PORT}
      - PRODUCT_SERVICE_URL=http://product-service:${PRODUCT_PORT}
  
  #auth-service:
   # build: 
  #    context: .
   #   dockerfile: ./auth-service/Dockerfile
   # expose:
   #   - "${AUTH_PORT}"
   # env_file:
   #   - ./.env
   # networks:
   #   - app-network

  product-service:
    build: 
      context: .
      dockerfile: ./product-service/Dockerfile
    env_file:
      - ./.env
    expose:
      - "${PRODUCT_PORT}"
    networks:
      - app-network

  postgres:
    image: postgres:15
    restart: always
    container_name: techstore_postgres
    expose:
      - "${POSTGRES_PORT}"
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"] 
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      
  redis:
    image: redis:7-alpine
    restart: always
    container_name: techstore_redis
    expose:
      - "${REDIS_PORT}"
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      "
    volumes:
      - redis_data:/data
    healthcheck:
      test: [
        "CMD", "redis-cli",
        "--raw", "incr", "ping"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app-network
      
volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge